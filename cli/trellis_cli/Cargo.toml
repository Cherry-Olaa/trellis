[package]
name = "trellis_cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "trellis"
path = "src/main.rs"

# Only the dependencies actually imported by the crate are declared here.
#

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dotenvy = "0.15"
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
url = "2"
ed25519-dalek = "2.0"
base64 = "0.21"
unicode-normalization = "0.1"
