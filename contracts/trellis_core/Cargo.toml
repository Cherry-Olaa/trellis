[package]
name = "trellis_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# `rlib` is required so the `contract_bench` benchmark target can link against
# the contract crate; `cdylib` is what the wasm deployment artefact is built
# from.
crate-type = ["cdylib", "rlib"]

# soroban-sdk 22.x only — the on-chain ABI (env interface version) is tied to
# the major version, and each minor/patch is expected to stay
# backwards-compatible within it. The explicit upper bound keeps a future
# major bump (23) from being pulled in silently; Cargo.lock (committed) pins
# the exact resolved version for reproducible builds across environments.
# Deploying the compiled WASM requires a `stellar` CLI build that supports the
# soroban-sdk 22.x host environment — see DEPLOYMENT.md's Prerequisites for
# the version this repo has been verified against.
[dependencies]
soroban-sdk = { version = ">=22.0.0, <23", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = ">=22.0.0, <23", features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

[[bench]]
name = "contract_bench"
harness = false
